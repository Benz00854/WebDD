    .stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 14px; }

    .btn-accent { background: linear-gradient(135deg, var(--accent-dark), var(--accent)); color: #000; box-shadow: 0 4px 14px rgba(56,189,248,0.3); }

// ── DASHBOARD ──

      <div class="stat-label">${isTech?'กำลังซ่อม':'รอดำเนินการ'}</div>
    </div>
    <div class="stat-card blue"><div class="stat-icon blue">🔧</div>
      <div class="stat-value">${isAdmin?inprog:isTech?myT.filter(t=>t.status==='done').length:myT.filter(t=>t.status==='inprog').length}</div>
      <div class="stat-label">${isTech&&!isAdmin?'เสร็จแล้ว':'กำลังซ่อม'}</div>
    </div>
    <div class="stat-card green"><div class="stat-icon green">✅</div>
      <div class="stat-value">${isAdmin?done:myT.filter(t=>t.status==='done').length}</div>
      <div class="stat-label">เสร็จแล้ว</div>
    </div>
    ${isAdmin?`<div class="stat-card red"><div class="stat-icon red">🚨</div><div class="stat-value">${high}</div><div class="stat-label">เร่งด่วนค้างอยู่</div></div>`:''}
  </div>
  <div class="grid-3 fade-up">
    <div class="card">
      <div class="card-header">
        <div class="card-title">คำร้องล่าสุด</div>
        <button class="btn btn-ghost btn-sm" onclick="navigateTo('${isAdmin?'all-tickets':'my-tickets'}')">ดูทั้งหมด →</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>เรื่อง</th><th>สถานที่</th><th>สถานะ</th><th>ความเร่งด่วน</th></tr></thead>
          <tbody>${recent.map(t=>`
            <tr style="cursor:pointer" onclick="openDetail('${t.id}')">
              <td><span class="ticket-id">${t.id}</span></td>
              <td><div class="td-name">${t.title}</div><div style="font-size:11px;color:var(--text-muted)">${t.name}</div></td>

              <td><span class="badge ${statusMap[t.status].cls}">${statusMap[t.status].label}</span></td>

          </tbody>
        </table>
      </div>
    </div>
    <div>
      <div class="card" style="margin-bottom:20px">
        <div class="card-header"><div class="card-title">สัดส่วนสถานะ</div></div>
        <div class="card-body">
          ${[['รอดำเนินการ',pending,'#fbbf24'],['กำลังซ่อม',inprog,'#38bdf8'],['เสร็จแล้ว',done,'#34d399'],['ยกเลิก',cancelled,'#f87171']].map(([l,v,c])=>`

          <div class="file-upload" onclick="document.getElementById('ntImg').click()">

            <div class="file-upload-hint">รองรับ JPG, PNG (สูงสุด 5MB)</div>
          </div>
          <input type="file" id="ntImg" accept="image/*" multiple style="display:none" onchange="handleImg(event)" />
          <div class="image-preview-grid" id="imgGrid"></div>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)">
        <button class="btn btn-accent" onclick="submitTicket()">📤 ส่งคำร้อง</button>
        <button class="btn btn-ghost" onclick="navigateTo('dashboard')">ยกเลิก</button>
      </div>
    </div>

function handleImg(e) {
  Array.from(e.target.files).forEach(f => {
    const r = new FileReader();
    r.onload = ev => { pendingImages.push(ev.target.result); renderImgGrid(); };
    r.readAsDataURL(f);
  });
}

function renderImgGrid() {
  const g = document.getElementById('imgGrid');
  if (!g) return;
  g.innerHTML = pendingImages.map((s,i) => `<div class="image-preview-item"><img src="${s}" /><div class="image-remove" onclick="removeImg(${i})">✕</div></div>`).join('');
}

function removeImg(i) { pendingImages.splice(i,1); renderImgGrid(); }

function submitTicket() {
  const name = document.getElementById('nt-name').value.trim();
  const phone = document.getElementById('nt-phone').value.trim();
  const title = document.getElementById('nt-title').value.trim();
  const location = document.getElementById('nt-location').value.trim();
  const category = document.getElementById('nt-category').value;
  const priority = document.getElementById('nt-priority').value;
  const desc = document.getElementById('nt-desc').value.trim();
  if (!name||!title||!location||!category||!desc) { showToast('กรุณากรอกข้อมูลที่จำเป็นให้ครบ (*)','error'); return; }
  const id = 'TK-'+String(nextId++).padStart(4,'0');
  const now = new Date().toLocaleString('th-TH');
  tickets.unshift({ id, title, name, phone, location, category, priority, status:'pending', description:desc, tech:'', date:new Date().toISOString().split('T')[0], images:[...pendingImages], history:[{action:'แจ้งซ่อม',by:name,time:now}] });
  buildSidebar();
  showToast(`✅ ส่งคำร้อง ${id} เรียบร้อยแล้ว!`, 'success');
  navigateTo('my-tickets');
}

        </div>

function openTechJobs(name) {
  const list = tickets.filter(t=>t.tech===name);
  openModal(`งานของ ${name}`, `<div class="table-wrap"><table>
    <thead><tr><th>ID</th><th>หัวข้อ</th><th>สถานะ</th><th>วันที่</th></tr></thead>
    <tbody>${list.length?list.map(t=>`<tr><td><span class="ticket-id">${t.id}</span></td><td>${t.title}</td><td><span class="badge ${statusMap[t.status].cls}">${statusMap[t.status].label}</span></td><td>${t.date}</td></tr>`).join(''):`<tr><td colspan="4"><div class="empty-state" style="padding:20px"><div class="empty-icon">📭</div><div class="empty-title">ยังไม่มีงาน</div></div></td></tr>`}
    </tbody></table></div>`, [{label:'ปิด',cls:'btn btn-ghost',action:closeModal}]);
}

function openAssignToTech(techName) {
  const pending = tickets.filter(t=>t.status==='pending');
  if (!pending.length) { showToast('ไม่มีคำร้องรอดำเนินการ','info'); return; }
  openModal(`มอบหมายงานให้ ${techName}`, `
    <p style="color:var(--text-secondary);margin-bottom:14px;font-size:13px">เลือกคำร้องที่ต้องการมอบหมาย</p>
    <select class="form-input-styled" id="atSelect">
      ${pending.map(t=>`<option value="${t.id}">${t.id} — ${t.title}</option>`).join('')}
    </select>`,
    [{label:'มอบหมาย',cls:'btn btn-accent',action:()=>{
      const sel = document.getElementById('atSelect').value;
      const t = tickets.find(t=>t.id===sel);
      if (!t) return;
      t.tech=techName; t.status='inprog';
      t.history.push({action:`มอบหมายให้ ${techName}`,by:'Admin',time:new Date().toLocaleString('th-TH')});
      closeModal(); showToast(`✅ มอบหมาย ${sel} ให้ ${techName}`, 'success');
      buildSidebar(); navigateTo('technicians');
    }},{label:'ยกเลิก',cls:'btn btn-ghost',action:closeModal}]);
}

  const myT = tickets.filter(t=>t.tech===currentUser.name);
  const active = myT.filter(t=>t.status==='inprog');
  const done = myT.filter(t=>t.status==='done');
  const taskCard = t => `
    <div class="task-card">
      <div class="task-card-header">
        <div>
          <div class="task-card-title">${t.title}</div>
          <div class="task-card-meta">📍 ${t.location} · <span class="tag">${t.category}</span> · ${t.date}</div>
        </div>
        <span class="badge ${statusMap[t.status].cls}">${statusMap[t.status].label}</span>
      </div>
      <div class="task-card-body">${t.description}</div>
      <div class="task-card-footer">
        <div style="font-size:12px;color:var(--text-muted)">ผู้แจ้ง: ${t.name}${t.phone?' · 📞 '+t.phone:''}</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" onclick="openDetail('${t.id}')">รายละเอียด</button>
          ${t.status==='inprog'?`<button class="btn btn-green btn-sm" onclick="markDone('${t.id}')">✅ ซ่อมเสร็จ</button>`:''}
        </div>
      </div>
    </div>`;
  return `
  <div class="page-header fade-up"><div class="page-title">งานของฉัน</div><div class="page-subtitle">งานที่ได้รับมอบหมาย</div></div>
  <div class="fade-up">
    <div style="margin-bottom:20px">
      <div style="font-size:14px;font-weight:700;color:var(--accent);margin-bottom:10px">🔧 กำลังดำเนินการ (${active.length})</div>
      ${active.length?active.map(taskCard).join(''):`<div class="empty-state" style="padding:24px"><div class="empty-icon">🎉</div><div class="empty-title">ไม่มีงานค้างอยู่</div></div>`}
    </div>
    <div>
      <div style="font-size:14px;font-weight:700;color:var(--green);margin-bottom:10px">✅ เสร็จแล้ว (${done.length})</div>
      ${done.length?done.map(taskCard).join(''):`<div class="empty-state" style="padding:24px"><div class="empty-icon">📭</div><div class="empty-title">ยังไม่มีงานที่เสร็จ</div></div>`}
    </div>
  </div>`;
}

function markDone(id) {
  const t = tickets.find(t=>t.id===id);
  if (!t) return;
  openModal('✅ ยืนยันซ่อมเสร็จ', `
    <p style="color:var(--text-secondary);margin-bottom:14px">ยืนยันว่าซ่อม <strong>${t.title}</strong> เสร็จแล้ว?</p>
    <label class="form-label" for="doneNote">บันทึกเพิ่มเติม (ไม่บังคับ)</label>
    <textarea class="form-input-styled" id="doneNote" placeholder="อาการที่พบและวิธีแก้ไข..."></textarea>`,
    [{label:'ยืนยันเสร็จ',cls:'btn btn-accent',action:()=>{
      const note = document.getElementById('doneNote').value;
      t.status='done';
      t.history.push({action:'ซ่อมเสร็จแล้ว'+(note?`: ${note}`:''),by:currentUser.name,time:new Date().toLocaleString('th-TH')});
      closeModal(); showToast('✅ บันทึกงานซ่อมเสร็จ!','success');
      buildSidebar(); navigateTo('my-tasks');
    }},{label:'ยกเลิก',cls:'btn btn-ghost',action:closeModal}]);
}

    <div class="detail-row"><div class="detail-label">หัวข้อ</div><div class="detail-value" style="font-weight:700">${t.title}</div></div>

    [
      ...(isAdmin&&t.status==='pending'?[{label:'🔩 มอบหมายช่าง',cls:'btn btn-accent',action:()=>{closeModal();openAssign(t.id);}}]:[]),
      ...(isTech&&t.status==='inprog'&&t.tech===currentUser.name?[{label:'✅ ซ่อมเสร็จ',cls:'btn btn-accent',action:()=>{closeModal();markDone(t.id);}}]:[]),
      {label:'ปิด',cls:'btn btn-ghost',action:closeModal}
    ]);
}

// ── ASSIGN ──
function openAssign(id) {
  const t = tickets.find(t=>t.id===id);
  if (!t) return;
  openModal(`🔩 มอบหมายช่าง — ${id}`, `
    <p style="color:var(--text-secondary);margin-bottom:14px;font-size:13px">เลือกช่างสำหรับ <strong>${t.title}</strong></p>
    <select class="form-input-styled" id="techSel">
      <option value="">-- เลือกช่างซ่อม --</option>
      ${technicians.map(tc=>`<option value="${tc.name}">${tc.name} (${tc.spec})</option>`).join('')}
    </select>`,
    [{label:'มอบหมาย',cls:'btn btn-accent',action:()=>{
      const name = document.getElementById('techSel').value;
      if (!name) { showToast('กรุณาเลือกช่างซ่อม','error'); return; }
      t.tech=name; t.status='inprog';
      t.history.push({action:`มอบหมายให้ ${name}`,by:'Admin',time:new Date().toLocaleString('th-TH')});
      closeModal(); showToast(`✅ มอบหมาย ${id} ให้ ${name}`, 'success');
      buildSidebar();
      if (currentPage==='all-tickets') navigateTo('all-tickets');
    }},{label:'ยกเลิก',cls:'btn btn-ghost',action:closeModal}]);
}

function doCancel(id) {
  const t = tickets.find(t=>t.id===id);
  if (!t) return;
  openModal('ยืนยันยกเลิกคำร้อง', `
    <p style="color:var(--text-secondary)">ต้องการยกเลิกคำร้อง <strong>${id}</strong> ใช่หรือไม่?</p>
    <div style="margin-top:12px">
      <label class="form-label" for="cancelNote">เหตุผล (ไม่บังคับ)</label>
      <input class="form-input-styled" id="cancelNote" placeholder="ระบุเหตุผล..." />
    </div>`,
    [{label:'ยืนยันยกเลิก',cls:'btn btn-red',action:()=>{
      const note = document.getElementById('cancelNote').value;
      t.status='cancelled';
      t.history.push({action:'ยกเลิกคำร้อง',by:'Admin',time:new Date().toLocaleString('th-TH'),note});
      closeModal(); showToast(`คำร้อง ${id} ถูกยกเลิกแล้ว`,'info');
      buildSidebar(); navigateTo('all-tickets');
    }},{label:'ไม่ยกเลิก',cls:'btn btn-ghost',action:closeModal}]);
}

// ── FILTER ──
function setFilter(status, page) {
  filterStatus = status;
  navigateTo(page);
}

// ── SEARCH ──
function doSearch(q) {
  if (!q.trim()) { navigateTo(currentPage); return; }
  const r = tickets.filter(t=>[t.title,t.id,t.name,t.location,t.category,t.description].join(' ').toLowerCase().includes(q.toLowerCase()));
  document.getElementById('mainContent').innerHTML = `
    <div class="page-header"><div class="page-title">🔍 ผลการค้นหา "${q}"</div><div class="page-subtitle">พบ ${r.length} รายการ</div></div>
    <div class="card fade-up"><div class="table-wrap"><table>
      <thead><tr><th>ID</th><th>หัวข้อ</th><th>ผู้แจ้ง</th><th>สถานที่</th><th>สถานะ</th><th></th></tr></thead>
      <tbody>${r.length?r.map(t=>`
        <tr><td><span class="ticket-id">${t.id}</span></td><td><div class="td-name">${t.title}</div></td><td>${t.name}</td><td>📍 ${t.location}</td><td><span class="badge ${statusMap[t.status].cls}">${statusMap[t.status].label}</span></td><td><button class="btn btn-ghost btn-sm" onclick="openDetail('${t.id}')">รายละเอียด</button></td></tr>`).join('')
        :`<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">ไม่พบผลการค้นหา</div></div></td></tr>`}
      </tbody>
    </table></div></div>`;
}

// ── MODAL ──
function openModal(title, body, btns=[]) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFooter').innerHTML = btns.map((b,i)=>`<button class="${b.cls}" id="mb${i}">${b.label}</button>`).join('');
  btns.forEach((b,i)=>{ document.getElementById('mb'+i).onclick=b.action; });
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeModalOnBG(e) { if (e.target===document.getElementById('modalOverlay')) closeModal(); }

// ── TOAST ──
function showToast(msg, type='info') {
  const icons = {success:'✅',error:'❌',info:'ℹ️'};
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(()=>el.classList.add('show'),10);
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),300); }, 3500);
}

// ── IMAGE ZOOM ──
function zoomImg(src) {
  document.getElementById('imgZoomSrc').src = src;
  document.getElementById('imgZoom').classList.add('open');
}

// ── NOTIF ──
function toggleNotif() {
  const n = tickets.filter(t=>t.status==='pending').length;
  showToast(`🔔 คำร้องรอดำเนินการ ${n} รายการ`,'info');
}

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (e.key==='Escape') closeModal();
  if ((e.ctrlKey||e.metaKey)&&e.key==='k') { e.preventDefault(); document.getElementById('searchInput')?.focus(); }
});
</script>
</body>
</html>
